<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Middle Third</title>
    <style>
        /* 1. THE CANVAS: Deep Black & Reset */
        body, html {
            background-color: #000000;
            color: #FFFFFF;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif; /* Fallback */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 2. THE CENTER STAGE: Responsive Container */
        .container {
            /* Mobile First: Take up 90% of screen */
            width: 90%; 
            /* Desktop Constraint: Never get wider than 500px */
            max-width: 500px;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 3. THE TRI-FONT SYSTEM */
        
        /* The "Data" Layer (Structure) */
        h1 {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2rem;
            font-weight: normal;
        }

        .status {
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.8rem;
            color: #666; /* Dimmed text */
            margin-top: 4rem;
            line-height: 1.5;
        }

        /* The "Voice" Layer (Story) */
        p {
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #e0e0e0;
            margin-bottom: 2.5rem;
        }

        /* The "Utility" Layer (Action) */
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            width: 100%;
        }

        input[type="email"] {
            background: transparent;
            border: 1px solid #333;
            color: white;
            padding: 15px;
            width: 100%;
            box-sizing: border-box; /* Keeps padding inside width */
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
            outline: none;
            font-size: 1rem;
            border-radius: 0; /* Removes iOS rounded corners */
            -webkit-appearance: none;
        }

        input[type="email"]:focus {
            border-color: #fff;
        }

        button {
            background-color: #FFFFFF;
            color: #000000;
            border: none;
            padding: 15px 30px;
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
            transition: background 0.3s;
            border-radius: 0;
            -webkit-appearance: none;
        }

        button:hover {
            background-color: #cccccc;
        }

        /* Mobile Text Adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 1.2rem; }
            p { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>The Middle Third</h1>

        <p>
            A distraction-free, cinema-style environment in Madrid.
            The energy of the stadium with the comfort of a lounge.
        </p>

        <form action="https://the-middle-third.us1.list-manage.com/subscribe/post?u=9e95604a210cd0794a5c5c266&amp;id=6f39babc9a&amp;f_id=00c07de2f0" method="post" class="input-group" target="_blank">
            
            <input type="email" name="EMAIL" placeholder="ENTER PASSWORD / EMAIL" required>
            
            <div style="position: absolute; left: -5000px;" aria-hidden="true">
                <input type="text" name="b_9e95604a210cd0794a5c5c266_6f39babc9a" tabindex="-1" value="">
            </div>

            <button type="submit">Enter</button>
        </form>

        <div class="status">
            EST. 2026<br>
            MADRID
        </div>
    </div>

</body>
</html>
