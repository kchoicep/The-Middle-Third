    <style>
        :root {
            /* --- THE HERITAGE TECH PALETTE --- */
            --bg-color: #212121;       /* Deep Charcoal (Matte) */
            --bg-vignette: #2a2a2a;    /* Slightly lighter for spotlight effect */
            --text-color: #fffff0;     /* Ivory / Off-White */
            --text-dim: rgba(255, 255, 240, 0.85); /* For body text */
            --border-dim: rgba(255, 255, 240, 0.3); /* For blueprint lines */
            --accent-color: #65000b;   /* Deep Burgundy */
            --accent-glow: rgba(101, 0, 11, 0.6);
            
            --font-tactical: 'Barlow Condensed', sans-serif;
            --font-cinema: 'Courier Prime', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Create a "Dimly Lit Room" atmosphere with a subtle gradient */
            background: radial-gradient(circle at center, var(--bg-vignette) 0%, var(--bg-color) 100%);
            background-color: var(--bg-color); /* Fallback */
            color: var(--text-color);
            overflow: hidden; /* Locked initially */
            font-family: var(--font-cinema);
            height: 100vh; /* Ensures gradient fills screen */
        }

        /* --- LOGO STYLING --- */
        .logo-3d {
            width: 200px; /* Adjust size as needed */
            height: auto;
            margin-bottom: 2rem;
            /* Subtle shadow to make it float in the dark space */
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.3s ease;
        }
        
        /* Optional: Hover effect for the logo */
        .logo-3d:hover {
            transform: translateY(-5px);
        }

        /* --- STATE 1: THE GATE (Overlay) --- */
        #gate-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 0 2rem;
            
            /* Transition Settings */
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            opacity: 1;
            visibility: visible;
        }

        .gate-logo-container {
            margin-bottom: 2rem;
            text-align: center;
        }
