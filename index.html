<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Middle Third | Madrid</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Courier+Prime&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --accent-color: #000000;
            --font-tactical: 'Barlow Condensed', sans-serif;
            --font-cinema: 'Courier Prime', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden; /* Locked initially */
            font-family: var(--font-cinema);
            transition: background-color 0.5s;
        }

        /* --- STATE 1: THE GATE (Overlay) --- */
        #gate-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 0 2rem;
            
            /* Transition Settings */
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            opacity: 1;
            visibility: visible;
        }

        .gate-title {
            font-family: var(--font-tactical);
            font-size: 5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 3rem;
            text-align: center;
            line-height: 1;
        }

        .btn-enter {
            font-family: var(--font-tactical);
            background: transparent;
            color: var(--text-color);
            border: 3px solid var(--text-color);
            padding: 1rem 3rem;
            font-size: 1.5rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 0.1em;
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background-color: var(--text-color);
            color: var(--bg-color);
        }

        /* --- STATE 2: THE LOBBY (Main Content) --- */
        #lobby-screen {
            opacity: 0; /* Hidden initially */
            transition: opacity 1.5s ease-in-out; /* Slower fade in for drama */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem;
            visibility: hidden; /* Hides it from screen readers initially */
        }

        /* --- THE MAGIC SWITCH (Active State) --- */
        /* These rules apply when JS adds the 'site-entered' class */
        
        body.site-entered {
            overflow: auto; /* Unlocks scrolling */
        }

        body.site-entered #gate-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* Ensures you can't click the hidden button */
        }

        body.site-entered #lobby-screen {
            opacity: 1;
            visibility: visible;
        }


        /* --- REST OF DESIGN --- */
        .lobby-header-logo {
            font-family: var(--font-tactical);
            font-size: 2rem;
            margin-bottom: 4rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .signup-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 6rem;
            text-align: center;
            min-height: 150px; /* Prevents layout shift when form hides */
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .signup-intro {
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            transition: opacity 0.5s;
        }

        input[type="email"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--accent-color);
            background: transparent;
            font-family: var(--font-cinema);
            font-size: 1rem;
            text-align: center;
            text-transform: uppercase;
            outline: none;
        }
        
        input[type="email"]::placeholder {
            color: #666;
            opacity: 1;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--accent-color);
            background-color: var(--accent-color);
            color: var(--bg-color);
            font-family: var(--font-cinema);
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Success Message Styling */
        #success-message {
            display: none; /* Hidden by default */
            font-family: var(--font-cinema);
            font-size: 1rem;
            color: var(--text-color);
            text-align: center;
            padding: 2rem;
            border: 1px solid var(--accent-color); /* Keeps the "box" feel */
        }

        .concept-section {
            width: 100%;
            max-width: 1000px;
            border-top: 1px solid #e0e0e0;
            padding-top: 4rem;
        }

        .section-label {
            text-align: center;
            font-size: 0.8rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 3rem;
